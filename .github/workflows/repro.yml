name: Reproduce Voro++ periodic power-diagram issue

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-run:
    name: Build and run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment info
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner OS: $RUNNER_OS"
          uname -a
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sw_vers
            sysctl -n machdep.cpu.brand_string || true
          else
            lscpu | head -n 50 || true
          fi
          echo
          echo "Compilers:"
          (c++ --version || true)
          (clang++ --version || true)
          (g++ --version || true)

      # --------------------------------------------------------------------
      # Stable snapshot (mirrors the state discussed in the upstream issue)
      # --------------------------------------------------------------------
      - name: Build + run repro (stable snapshot)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./run.sh
          ./run.sh "out_${RUNNER_OS}_original.txt"

      - name: Summarize output (stable snapshot, informational)
        shell: bash
        run: |
          set -euo pipefail
          python3 ./scripts/check_output.py "out_${RUNNER_OS}_original.txt" --soft || true

      - name: Build + run (stable snapshot, patched)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./run_patched.sh
          ./run_patched.sh "out_${RUNNER_OS}_patched.txt"
          python3 ./scripts/check_output.py "out_${RUNNER_OS}_patched.txt" --expect pass

      - name: Build + run (Linux aggressive flags, stable snapshot, original)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./run_aggressive.sh
          ./run_aggressive.sh "out_${RUNNER_OS}_aggressive_original.txt"
          # This is expected to reproduce the macOS arm64 failure mode on many
          # x86_64 Linux machines, but we keep it informational to avoid
          # flaky CI if the runner's CPU/compiler happens to be "too stable".
          python3 ./scripts/check_output.py "out_${RUNNER_OS}_aggressive_original.txt" --expect broken --soft || true

      - name: Build + run (Linux aggressive flags, stable snapshot, patched)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./run_aggressive_patched.sh
          ./run_aggressive_patched.sh "out_${RUNNER_OS}_aggressive_patched.txt"
          python3 ./scripts/check_output.py "out_${RUNNER_OS}_aggressive_patched.txt" --expect pass

      # --------------------------------------------------------------------
      # Development snapshot (active branch upstream)
      # --------------------------------------------------------------------
      - name: Build + run repro (dev snapshot)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./run_dev.sh
          ./run_dev.sh "out_${RUNNER_OS}_dev_original.txt"

      - name: Summarize output (dev snapshot, informational)
        shell: bash
        run: |
          set -euo pipefail
          python3 ./scripts/check_output.py "out_${RUNNER_OS}_dev_original.txt" --soft || true

      - name: Build + run (dev snapshot, patched)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./run_dev_patched.sh
          ./run_dev_patched.sh "out_${RUNNER_OS}_dev_patched.txt"
          python3 ./scripts/check_output.py "out_${RUNNER_OS}_dev_patched.txt" --expect pass

      - name: Build + run (Linux aggressive flags, dev snapshot, original)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./run_dev_aggressive.sh
          ./run_dev_aggressive.sh "out_${RUNNER_OS}_dev_aggressive_original.txt"
          python3 ./scripts/check_output.py "out_${RUNNER_OS}_dev_aggressive_original.txt" --expect broken --soft || true

      - name: Build + run (Linux aggressive flags, dev snapshot, patched)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./run_dev_aggressive_patched.sh
          ./run_dev_aggressive_patched.sh "out_${RUNNER_OS}_dev_aggressive_patched.txt"
          python3 ./scripts/check_output.py "out_${RUNNER_OS}_dev_aggressive_patched.txt" --expect pass

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ matrix.os }}
          path: out_*.txt
          if-no-files-found: error
